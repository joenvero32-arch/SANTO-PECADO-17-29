name: Deploy Santo Pecado 17-29 to GitHub Pages

on:
  push:
    branches: ["main", "principal"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Integrar módulo de administración
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          import os
          tag='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-finish.js?v='+os.environ.get("GITHUB_SHA","latest")+'"></script>'
          import re
          s=re.sub(r'<script[^>]+admin-finish\.js(?:\?[^>]*)?</script>', '', s)
          if '</body>' in s:
              head,tail=s.rsplit('</body>',1)\n              s=head+tag+'\n</body>'+tail
          else:
              s += '\n'+tag+'\n'
          p.write_text(s,encoding="utf-8")
          PY

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
