name: Deploy Santo Pecado 17-29 to GitHub Pages

on:
  push:
    branches: ["main", "principal"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Integrar módulos de la aplicación
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          sha = os.environ.get("GITHUB_SHA", "latest")

          # Retirar las etiquetas previas de módulos que el workflow administra.
          for name in ("admin-finish.js", "stats-nav-fix.js", "catalog-image-optimizer.js"):
              s = re.sub(r'<script[^>]+\\b' + re.escape(name) + r'(?:\\?[^>]*)?>\\s*</script>', '', s)

          tag = (
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              f'<script src="admin-finish.js?v={sha}"></script>\\n'
              f'<script src="stats-nav-fix.js?v={sha}"></script>\\n'
              f'<script src="stats-print-fix.js?v={sha}"></script>\\n'
              f'<script src="catalog-image-optimizer.js?v={sha}"></script>\\n'
          )

          if "</body>" in s:
              head, tail = s.rsplit("</body>", 1)
              s = head + tag + "</body>" + tail
          else:
              s += "\\n" + tag

          p.write_text(s, encoding="utf-8")
          PY

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
